[package]
name = "kon"
version = "0.1.0"
edition = "2021"
description = "Kon — o notch do Windows (versão nativa em Rust)"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
iana-time-zone = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Media_Control", "Foundation", "Storage_Streams", "Win32_UI_Shell"] }
tray-icon = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# só para testar a interface no Linux (o produto é para Windows)
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }
