# Publica uma versão nova do Kon: ao enviar uma tag v<versão> (ex.: v1.2.0), o GitHub compila o
# instalador e cria a Release com Kon-Setup-<versão>.exe + latest.yml. Os apps instalados se atualizam sozinhos.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - run: npm ci
      - name: Instalador
        run: npm run installer
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão do package.json ($V)"; exit 1
          fi
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then ARGS="--notes-file $NOTES"; else ARGS="--generate-notes"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/Kon-Setup-$V.exe" release/latest.yml --clobber
          else
            gh release create "$TAG" "release/Kon-Setup-$V.exe" release/latest.yml --title "Kon $V" $ARGS
          fi
