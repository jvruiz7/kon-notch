name: Kon nativo (Rust)
on:
  push:
    branches: [main]
    paths: ["nativo/**", ".github/workflows/nativo.yml"]
permissions:
  contents: write
jobs:
  ui-linux:
    # cliques reais em Xvfb: cada página, Ajustes e Perguntar precisam abrir, e o app não pode cair
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nativo } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: nativo }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool imagemagick libxkbcommon-x11-0 libgl1-mesa-dri libegl1 libxcursor1 libxrandr2 libxi6
      - run: cargo test
      - run: cargo build
      - run: python3 tests_ui/clicks.py target/debug/kon
      - if: failure()
        run: cat /tmp/kon-clicks.log || true
  build:
    needs: ui-linux
    runs-on: windows-latest
    defaults: { run: { working-directory: nativo } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: nativo }
      - run: cargo build --release
      - run: cargo test --release
      - name: Abre o Kon nativo por 15 s (não pode fechar sozinho)
        shell: pwsh
        run: |
          $env:KON_PORTABLE = '1'; $env:KON_CI = '1'
          $p = Start-Process target\release\kon.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) {
            $log = Join-Path $env:APPDATA 'KonNativo\erro.log'; $txt = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
            Write-Host $txt
            # a máquina do CI não tem placa de vídeo nem OpenGL: esse caso só é testado no PC; qualquer outro erro barra
            if ($txt -match 'opengl 2\.0') { Write-Host "::warning::sem OpenGL no CI; abrir/desenhar será testado no PC"; "MEM=?" >> $env:GITHUB_ENV; "SIZE=$([math]::Round((Get-Item target\release\kon.exe).Length / 1KB))" >> $env:GITHUB_ENV; exit 0 }
            Write-Host "::error::o Kon nativo fechou sozinho (código $($p.ExitCode))"; exit 1
          }
          $mb = [math]::Round((Get-Process -Id $p.Id).WorkingSet64 / 1MB)
          $kb = [math]::Round((Get-Item target\release\kon.exe).Length / 1KB)
          Write-Host "Memória: $mb MB · tamanho do exe: $kb KB"
          "MEM=$mb" >> $env:GITHUB_ENV; "SIZE=$kb" >> $env:GITHUB_ENV
          Stop-Process -Id $p.Id -Force
      - name: Monta o instalador (KonSetup.exe)
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress | Out-Null }
          if (-not (Test-Path $mk)) { $mk = (Get-Command makensis -ErrorAction Stop).Source }
          & $mk "-DVERSION=$v" installer\kon.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Instalador: $([math]::Round((Get-Item installer\KonSetup.exe).Length / 1KB)) KB"
      - name: Publica a versão (o Kon instalado se atualiza sozinho)
        if: contains(github.event.head_commit.message, '[publicar]')
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "nativo-v$v"
          Copy-Item target\release\kon.exe "Kon.exe"
          Copy-Item installer\KonSetup.exe "KonSetup.exe"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag "Kon.exe" "KonSetup.exe" --clobber } else { gh release create $tag "KonSetup.exe" "Kon.exe" --title "Kon $v" --notes "Kon $v (Rust nativo). Baixe o KonSetup.exe e instale. O Kon.exe é usado pelas atualizações automáticas." }
